[package]
name = "loxy-core"
version = "0.1.0"
edition = "2021"
description = "Core Minecraft modpack sync, OAuth, JRE management, server ping, and process launcher engine for LoxyLauncher"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
dirs = "6.0"
sysinfo = "0.33"
discord-rich-presence = "0.2"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
