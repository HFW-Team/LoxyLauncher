name: Build & Release (Native)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-native:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            artifact-name: 'loxylauncher-windows.exe'
            binary-path: 'target/release/loxylauncher.exe'
          - platform: 'ubuntu-22.04'
            artifact-name: 'loxylauncher-linux'
            binary-path: 'target/release/loxylauncher'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxcursor-dev libxi-dev

      - name: Build release binary
        run: cargo build --release

      - name: Rename binary for upload
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/release/loxylauncher.exe target/release/loxylauncher-windows.exe
          else
            cp target/release/loxylauncher target/release/loxylauncher-linux
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: target/release/${{ matrix.artifact-name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.artifact-name }}
          name: 'LoxyLauncher Native ${{ github.ref_name }}'
          body: 'Ultra-lightweight native Minecraft launcher built with Slint (pure software rendering, ~25MB RAM).'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
